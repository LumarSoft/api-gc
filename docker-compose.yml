services:
  db:
    image: mysql:8.4
    container_name: cg-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cg
      MYSQL_USER: cg
      MYSQL_PASSWORD: cg
    ports:
      - '3306:3306'
    volumes:
      - cg-db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cg-db-data:
